                    <div key={a.id} className="glass-card rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                      <div>
                        <h4 className="font-bold text-white text-sm">{a.jobs?.titre}</h4>
                        <p className="text-xs text-blue-400 font-semibold">{a.jobs?.profiles?.nom_entreprise}</p>
                        <p className="text-[11px] text-slate-400 mt-1 line-clamp-1">{a.motivation}</p>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className={`badge ${a.statut==="ACCEPTEE"?"bg-emerald-500/20 text-emerald-300 border-emerald-500/30":a.statut==="REFUSEE"?"bg-red-500/20 text-red-300 border-red-500/30":"bg-amber-500/20 text-amber-300 border-amber-500/30"} border`}>
                          {a.statut==="EN_ATTENTE"?"En attente":a.statut==="ACCEPTEE"?"Accepté":a.statut}
                        </span>
                        <button onClick={()=>{setActiveChatApp(a);setView("MESSAGES");}} className="btn-ghost px-3 py-1.5 rounded-xl text-xs flex items-center gap-1">
                          <IconMessage/> Discuter
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {/* ═══════ RECRUTEUR DASHBOARD ═══════ */}
        {view==="RECRUTEUR_DASH"&&(
          <div className="max-w-6xl mx-auto space-y-6 animate-fade-in">
            <div className="glass-strong rounded-3xl p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <span className="badge bg-purple-500/20 text-purple-300 border border-purple-500/30 mb-1">Espace Recruteur</span>
                <h1 className="text-2xl font-black text-white">{profile?.nom_entreprise}</h1>
                <p className="text-xs text-slate-400 mt-0.5">{profile?.description}</p>
              </div>
              <div className="flex gap-2">
                <button onClick={()=>setView("POST_JOB")} className="btn-haiti px-4 py-2.5 rounded-xl text-xs flex items-center gap-2"><IconPlus/>Publier une Offre</button>
                <button onClick={()=>setView("MESSAGES")} className="btn-ghost px-4 py-2.5 rounded-xl text-xs flex items-center gap-2"><IconMessage/>Messagerie</button>
              </div>
            </div>

            {/* MY JOBS LIST WITH TOGGLE STATUS */}
            <div className="glass rounded-3xl p-6 space-y-4">
              <h2 className="text-base font-bold text-white">Mes Offres Publiées ({myJobsList.length})</h2>
              {myJobsList.length===0?(
                <p className="text-xs text-slate-500 py-4">Aucune offre publiée pour le moment.</p>
              ):(
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {myJobsList.map(j=>(
                    <div key={j.id} className="glass-card rounded-2xl p-4 flex items-center justify-between">
                      <div>
                        <h4 className="font-bold text-white text-xs">{j.titre}</h4>
                        <p className="text-[10px] text-slate-400">{j.type_contrat} • {j.salaire_range} {j.devise}</p>
                      </div>
                      <button onClick={()=>toggleJobStatus(j.id, j.statut)} className={`badge cursor-pointer ${j.statut==='ACTIF'?'bg-emerald-500/20 text-emerald-300 border-emerald-500/30':'bg-slate-700 text-slate-300 border-slate-600'} border`}>
                        {j.statut==='ACTIF'?'● Actif':'○ Fermé'}
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* RECEIVED APPLICATIONS */}

                <div className="space-y-4">

                        <div>

                        <span className={`badge ${a.statut==="ACCEPTEE"?"bg-emerald-500/20 text-emerald-300 border-emerald-500/30":a.statut==="REFUSEE"?"bg-red-500/20 text-red-300 border-red-500/30":"bg-amber-500/20 text-amber-300 border-amber-500/30"} border`}>

                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block font-semibold text-slate-400 mb-1">Email</label><input name="email" type="email" required placeholder="email@domaine.ht" className="input-dark w-full p-2.5 rounded-xl"/></div>
                    <div><label className="block font-semibold text-slate-400 mb-1">Mot de Passe</label><input name="pwd" type="password" required minLength="6" placeholder="••••••" className="input-dark w-full p-2.5 rounded-xl"/></div>

                  </div>
                  <div><label className="block font-semibold text-slate-400 mb-1">Titre Professionnel / Métier</label><input name="titre" required placeholder="Infirmière, Développeur, Comptable..." className="input-dark w-full p-2.5 rounded-xl text-sm font-bold text-blue-400"/></div>
                  <div><label className="block font-semibold text-slate-400 mb-1">Compétences (virgules)</label><input name="comp" placeholder="React, Excel, Soins d'urgence..." className="input-dark w-full p-2.5 rounded-xl"/></div>
                  <div><label className="block font-semibold text-slate-400 mb-1">N° CIN / NIF</label><input name="cinNif" required placeholder="004-XXX-XXX-X" className="input-dark w-full p-2.5 rounded-xl"/></div>
                  <div><label className="block font-semibold text-slate-400 mb-1">Bio courte</label><textarea name="bio" rows="2" placeholder="Parlez de votre expérience..." className="input-dark w-full p-2.5 rounded-xl resize-none"/></div>
                  <div className="grid grid-cols-2 gap-3">
                    <label className="glass rounded-xl p-3.5 cursor-pointer hover:bg-white/5 border-dashed border border-white/10">

                  <div className="grid grid-cols-2 gap-3">

                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block font-semibold text-slate-400 mb-1">Téléphone (+509)</label><input name="tel" required placeholder="+509 XXXX-XXXX" className="input-dark w-full p-2.5 rounded-xl"/></div>
                    <div><label className="block font-semibold text-slate-400 mb-1">N° NIF / Patente / STAT</label><input name="nif" required placeholder="Numéro officiel" className="input-dark w-full p-2.5 rounded-xl"/></div>

                  <div><label className="block font-semibold text-slate-400 mb-1">Description / Secteur</label><textarea name="desc" rows="3" placeholder="Décrivez votre activité..." className="input-dark w-full p-2.5 rounded-xl resize-none"/></div>

      <footer className="border-t border-white/5 mt-16">
        <div className="max-w-7xl mx-auto px-6 py-10 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
          <div className="flex items-center gap-3">
            <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center text-[10px] font-bold text-white shadow">JP</div>
            <span className="font-semibold">© 2026 Job Peyi — République d'Haïti</span>
          </div>
          <div>Plateforme nationale d'emploi, négociation salariale & recrutement certifié</div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
(function(){
  const c=document.getElementById('constellation');
  if(!c)return;
  const ctx=c.getContext('2d');
  let W,H,particles=[];
  const resize=()=>{W=c.width=innerWidth;H=c.height=innerHeight};
  addEventListener('resize',resize);resize();

  const colors=['59,130,246','59,130,246','239,68,68','139,92,246'];

  for(let i=0;i<75;i++){
    const col=colors[Math.floor(Math.random()*colors.length)];
    particles.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,
      r:Math.random()*1.8+.5,col,
      pulse:Math.random()*Math.PI*2,pulseSpeed:.01+Math.random()*.02
    });
  }

  let mouse={x:-1000,y:-1000};
  document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});

  function frame(){
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<particles.length;i++){
      const p=particles[i];
      p.x+=p.vx;p.y+=p.vy;
      p.pulse+=p.pulseSpeed;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;

      const mdx=p.x-mouse.x,mdy=p.y-mouse.y;
      const mdist=Math.sqrt(mdx*mdx+mdy*mdy);
      if(mdist<140){
        p.x+=mdx/mdist*.7;
        p.y+=mdy/mdist*.7;
      }

      const alpha=.3+Math.sin(p.pulse)*.2;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.col},${alpha})`;
      ctx.fill();

      for(let j=i+1;j<particles.length;j++){
        const p2=particles[j];
        const dx=p.x-p2.x,dy=p.y-p2.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<115){
          ctx.beginPath();
          ctx.moveTo(p.x,p.y);
          ctx.lineTo(p2.x,p2.y);
          const lineAlpha=(1-dist/115)*.12;
          ctx.strokeStyle=`rgba(${p.col},${lineAlpha})`;
          ctx.lineWidth=.6;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
